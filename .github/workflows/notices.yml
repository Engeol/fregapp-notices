# Template only: not installed in .github/workflows and cannot run automatically.
# Template only. External activation still needs an explicit review and approval.
name: Free household notices
on:
  schedule:
    - cron: '0 9 * * *'
      timezone: Europe/Madrid
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: household-notifications
  cancel-in-progress: false
jobs:
  notices:
    if: vars.FREGAPP_FREE_DELIVERY_APPROVED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scheduler/call-endpoint.mjs
        env:
          FREGAPP_HTTP_PUSH_URL: ${{ secrets.FREGAPP_HTTP_PUSH_URL }}
          FREGAPP_HTTP_PUSH_HMAC_SECRET: ${{ secrets.FREGAPP_HTTP_PUSH_HMAC_SECRET }}
